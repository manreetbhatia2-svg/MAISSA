<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scheme Recommender</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, #e9ddff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #dcd0ff 0%, transparent 35%),
                #f5f3ff;
            min-height: 100vh;
            color: #27233a;
            padding: 40px 20px;
        }

        .container {
            max-width: 860px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 38px;
            box-shadow: 0 15px 45px rgba(80, 60, 130, 0.12);
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 32px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #6c4ce8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: 0 8px 20px rgba(108, 76, 232, 0.25);
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 800;
        }

        .header p {
            margin: 4px 0 0;
            color: #77718c;
            font-size: 13px;
        }

        /* SECTION */

        .section {
            margin-top: 28px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #413a58;
        }

        /* DOMAIN BUTTONS */

        .domain-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .domain-btn {
            border: 1.5px solid #e3dff0;
            background: #faf9fd;
            border-radius: 16px;
            padding: 17px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .domain-btn:hover {
            border-color: #a28be9;
        }

        .domain-btn.active {
            border-color: #6c4ce8;
            background: #f2eeff;
            box-shadow: 0 0 0 2px rgba(108, 76, 232, 0.08);
        }

        .domain-btn strong {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .domain-btn span {
            font-size: 12px;
            color: #77718c;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            margin-top: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 9px;
            color: #413a58;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 13px;
            border: 1.5px solid #ded9eb;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: #6c4ce8;
            box-shadow: 0 0 0 3px rgba(108, 76, 232, 0.09);
        }

        input::placeholder {
            color: #aaa5b7;
        }

        .preview {
            margin-top: 7px;
            font-size: 11px;
            color: #817a93;
        }

        /* SEGMENTED BUTTONS */

        .segmented {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .segmented button {
            border: 1.5px solid #ded9eb;
            background: #faf9fd;
            border-radius: 13px;
            padding: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #59526d;
            cursor: pointer;
            transition: 0.2s;
        }

        .segmented button:hover {
            border-color: #a28be9;
        }

        .segmented button.active {
            border-color: #6c4ce8;
            background: #f2eeff;
            color: #5b3fd0;
            box-shadow: 0 0 0 2px rgba(108, 76, 232, 0.08);
        }

        /* SUBMIT */

        .submit-btn {
            width: 100%;
            margin-top: 32px;
            border: none;
            border-radius: 15px;
            padding: 17px;
            background: #6c4ce8;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 22px rgba(108, 76, 232, 0.25);
        }

        .submit-btn:hover {
            background: #5b3fd0;
            transform: translateY(-1px);
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #8a849b;
            font-size: 11px;
        }

        .footer strong {
            color: #6c4ce8;
        }

        /* RESPONSIVE */

        @media (max-width: 650px) {
            .card {
                padding: 25px;
            }

            .form-grid,
            .domain-options {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- HEADER -->
        <div class="header">
            <div class="logo">⚡</div>

            <div>
                <h1>Scheme Recommender</h1>
                <p>Social Credit Scheme Matching Platform</p>
            </div>
        </div>


        <form action="/recommend" method="POST">

            <!-- DOMAIN -->
            <div class="section">

                <div class="section-title">
                    Select Your Requirement
                </div>

                <div class="domain-options">

                    <button
                        type="button"
                        class="domain-btn active"
                        id="businessBtn"
                        onclick="selectDomain('business')">

                        <strong>Business Enterprise</strong>
                        <span>
                            Loans and financial support for business activities
                        </span>

                    </button>


                    <button
                        type="button"
                        class="domain-btn"
                        id="educationBtn"
                        onclick="selectDomain('education')">

                        <strong>Higher Education</strong>
                        <span>
                            Financial assistance for higher education
                        </span>

                    </button>

                </div>

                <input
                    type="hidden"
                    name="project_type"
                    id="project_type"
                    value="business"
                    required
                >

            </div>


            <!-- FINANCIAL DETAILS -->

            <div class="section">

                <div class="section-title">
                    Financial Details
                </div>

                <div class="form-grid">

                    <!-- PROJECT COST -->
                    <div class="field">

                        <label for="cost">
                            Estimated Project Outlay
                        </label>

                        <input
                            type="number"
                            id="cost"
                            name="cost"
                            min="0"
                            step="100000"
                            placeholder="e.g. 500000"
                            required
                            oninput="formatINR('cost', 'costPreview')"
                        >

                        <div
                            class="preview"
                            id="costPreview">
                        </div>

                    </div>


                    <!-- FAMILY INCOME -->
                    <div class="field">

                        <label for="income">
                            Annual Family Income
                        </label>

                        <input
                            type="number"
                            id="income"
                            name="income"
                            min="0"
                            step="100000"
                            placeholder="e.g. 300000"
                            required
                            oninput="formatINR('income', 'incomePreview')"
                        >

                        <div
                            class="preview"
                            id="incomePreview">
                        </div>

                    </div>

                </div>

            </div>


            <!-- TARGET GROUP -->

            <div class="section">

                <div class="section-title">
                    Target Group
                </div>

                <div class="segmented">

                    <button
                        type="button"
                        id="btnSC"
                        class="active"
                        onclick="selectCategory('SC')">

                        SC

                    </button>


                    <button
                        type="button"
                        id="btnOther"
                        onclick="selectCategory('Other')">

                        Other

                    </button>

                </div>

                <input
                    type="hidden"
                    name="category"
                    id="category"
                    value="SC"
                    required
                >

            </div>


            <!-- ACADEMIC STATUS -->

            <div class="section">

                <div class="section-title">
                    Academic Status
                </div>

                <div class="segmented">

                    <button
                        type="button"
                        id="studentBtn"
                        onclick="selectStatus('student')">

                        Currently a Student

                    </button>


                    <button
                        type="button"
                        id="nonStudentBtn"
                        class="active"
                        onclick="selectStatus('not_student')">

                        Non-Student / Professional

                    </button>

                </div>

                <input
                    type="hidden"
                    name="education_status"
                    id="education_status"
                    value="not_student"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn">

                Find Suitable Credit Schemes

            </button>

        </form>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        🛡️ Zero Intermediaries • Verified DBT Framework
        <br>
        <strong>MAISSA Credit Core</strong>
    </div>

</div>


<script>

    // ----------------------------------------
    // DOMAIN SELECTION
    // ----------------------------------------

    function selectDomain(val) {

        document.getElementById('project_type').value = val;

        document
            .getElementById('businessBtn')
            .classList.toggle(
                'active',
                val === 'business'
            );

        document
            .getElementById('educationBtn')
            .classList.toggle(
                'active',
                val === 'education'
            );
    }


    // ----------------------------------------
    // TARGET GROUP SELECTION
    // ----------------------------------------

    function selectCategory(val) {

        document.getElementById('category').value = val;

        document
            .getElementById('btnSC')
            .classList.toggle(
                'active',
                val === 'SC'
            );

        document
            .getElementById('btnOther')
            .classList.toggle(
                'active',
                val === 'Other'
            );
    }


    // ----------------------------------------
    // EDUCATION STATUS
    // ----------------------------------------

    function selectStatus(val) {

        document
            .getElementById('education_status')
            .value = val;

        document
            .getElementById('studentBtn')
            .classList.toggle(
                'active',
                val === 'student'
            );

        document
            .getElementById('nonStudentBtn')
            .classList.toggle(
                'active',
                val === 'not_student'
            );
    }


    // ----------------------------------------
    // INR PREVIEW
    // ----------------------------------------

    function formatINR(inputId, previewId) {

        const value =
            document.getElementById(inputId).value;

        const preview =
            document.getElementById(previewId);

        if (value && Number(value) >= 0) {

            const formatted =
                Number(value).toLocaleString(
                    'en-IN'
                );

            preview.textContent =
                '≈ ₹ ' + formatted;

        } else {

            preview.textContent = '';

        }
    }

</script>

</body>
</html>
